name: Rebuild agent workspace

on:
  push:
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/rebuild-opencode-plus.yml
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: Force a rebuild even when the OpenCode base image is unchanged
        required: false
        type: boolean
        default: false

env:
  BASE_IMAGE: ghcr.io/anomalyco/opencode
  IMAGE: brokenjade/opencode_plus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get latest OpenHands Agent Canvas version
        id: openhands
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view @openhands/agent-canvas version)"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected OpenHands version from npm: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to rebuild
        id: changed
        shell: bash
        run: |
          docker pull "${BASE_IMAGE}"
          new_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${BASE_IMAGE}")"

          old_digest=""
          old_openhands_version=""
          if docker pull "${IMAGE}:latest" 2>/dev/null; then
            old_digest="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' "${IMAGE}:latest")"
            old_openhands_version="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.openhands.version"}}' "${IMAGE}:latest")"
          fi

          echo "new_digest=${new_digest}" >> "$GITHUB_OUTPUT"
          echo "old_digest=${old_digest}" >> "$GITHUB_OUTPUT"
          echo "old_openhands_version=${old_openhands_version}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" = "push" ] \
            || [ "${{ inputs.force }}" = "true" ] \
            || [ "${new_digest}" != "${old_digest}" ] \
            || [ "${{ steps.openhands.outputs.version }}" != "${old_openhands_version}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get OpenCode version
        id: version
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          raw="$(docker run --rm --entrypoint opencode "${BASE_IMAGE}" --version 2>/dev/null || true)"
          version="$(echo "${raw}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*' | head -n1)"
          if [ -z "${version}" ]; then
            echo "::warning::Could not determine OpenCode version"
            version="unknown"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENHANDS_AGENT_CANVAS_VERSION=${{ steps.openhands.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.digest=${{ steps.changed.outputs.new_digest }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.openhands.version=${{ steps.openhands.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Prepare Docker Hub readme
        if: steps.changed.outputs.changed == 'true'
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENHANDS_VERSION: ${{ steps.openhands.outputs.version }}
        shell: bash
        run: |
          build_date="$(date -u +%Y-%m-%d)"
          if grep -q '{{OPENCODE_VERSION}}\|{{OPENHANDS_VERSION}}' README.md; then
            sed \
              -e "s/{{OPENCODE_VERSION}}/${OPENCODE_VERSION}/g" \
              -e "s/{{OPENHANDS_VERSION}}/${OPENHANDS_VERSION}/g" \
              -e "s/{{BUILD_DATE}}/${build_date}/g" \
              README.md > README.dockerhub.md
          else
            {
              echo "> **Bundled OpenCode:** \`${OPENCODE_VERSION}\` · **OpenHands Agent Canvas:** \`${OPENHANDS_VERSION}\` · built ${build_date} · build #${{ github.run_number }}"
              echo
              cat README.md
            } > README.dockerhub.md
          fi

      - name: Update Docker Hub description and readme
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./README.dockerhub.md
          short-description: OpenCode Plus (OpenCode v${{ steps.version.outputs.version }} + OpenHands Agent Canvas v${{ steps.openhands.outputs.version }}) with zsh, git, curl, uv, and Python 3.14 preinstalled

      - name: Skip when unchanged
        if: steps.changed.outputs.changed == 'false'
        run: echo "OpenCode and OpenHands versions are unchanged; skipping rebuild."
