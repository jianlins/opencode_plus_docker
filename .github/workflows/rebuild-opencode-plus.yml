name: Rebuild opencode_plus

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a rebuild even if the base image is unchanged'
        required: false
        type: boolean
        default: false

env:
  BASE_IMAGE: ghcr.io/anomalyco/opencode
  IMAGE: brokenjade/opencode_plus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if base image changed
        id: changed
        run: |
          docker pull ${{ env.BASE_IMAGE }}
          NEW_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' ${{ env.BASE_IMAGE }})

          OLD_DIGEST=""
          if docker pull ${{ env.IMAGE }}:latest 2>/dev/null; then
            OLD_DIGEST=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' ${{ env.IMAGE }}:latest)
          fi

          echo "new_digest=$NEW_DIGEST" >> "$GITHUB_OUTPUT"
          echo "old_digest=$OLD_DIGEST" >> "$GITHUB_OUTPUT"
          if [ "$NEW_DIGEST" != "$OLD_DIGEST" ] || [ "${{ inputs.force }}" == "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.digest=${{ steps.changed.outputs.new_digest }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Update Docker Hub description and readme
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./README.md
          short-description: OpenCode Plus Docker image with zsh, git, curl, uv and Python 3.14 preinstalled

      - name: Skip - no base change
        if: steps.changed.outputs.changed == 'false'
        run: echo "Base image unchanged (${{ steps.changed.outputs.old_digest }}), skipping rebuild."
